<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYNC ADMIN • Painel</title>
<style>
:root{color-scheme:dark;--bg:#070d19;--panel:#101b2e;--line:#24344e;--ink:#e8f1ff;--muted:#92a6c5;--cyan:#49d9fa;--green:#36dba4;--red:#ff788d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#152c47,#070d19 60%);font:15px system-ui,Segoe UI,sans-serif;color:var(--ink);min-height:100vh}
header{border-bottom:1px solid var(--line);padding:21px max(20px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:2px;font-size:23px}.brand span{color:var(--cyan)}.sub{color:var(--muted);font-size:12px;letter-spacing:1px}
main{max-width:1180px;margin:auto;padding:28px 20px}button,input{font:inherit}button{cursor:pointer;background:#1a3453;border:1px solid #355a7c;border-radius:10px;color:#e9f7ff;padding:10px 14px;font-weight:700}button:hover{background:#254e74}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#087da7;border-color:#23bbdf}.danger{background:#572538;border-color:#a34b62}.green{background:#135e50;border-color:#248c73}
input{background:#071425;color:#fff;border:1px solid #39516d;border-radius:10px;padding:12px;width:100%;outline:none}input:focus{border-color:var(--cyan)}
.login{max-width:460px;margin:80px auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px}.login h1{margin:0 0 10px}.login p{color:var(--muted)}.login button{width:100%;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:24px 0}.stat,.panel{background:rgba(16,27,46,.94);border:1px solid var(--line);border-radius:16px}.stat{padding:20px}.stat label{color:var(--muted);font-size:12px;letter-spacing:1.5px}.stat strong{display:block;font-size:34px;margin-top:8px}
.panel{padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.top h2{margin:0}.row{display:grid;grid-template-columns:minmax(160px,2fr) minmax(90px,1fr) minmax(110px,1fr) minmax(250px,2fr);align-items:center;gap:12px;padding:17px 4px;border-top:1px solid var(--line)}.row:first-child{border-top:0}.id{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere;color:#d0e6ff}.muted{color:var(--muted);font-size:12px}.pill{display:inline-block;border-radius:20px;padding:6px 10px;background:#27374c;font-size:12px}.pill.unlocked{background:#125543;color:#a1fce0}.pill.locked{background:#622839;color:#ffc4d0}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{font-size:12px;padding:9px}
#notice{min-height:22px;color:#ffc7a6;margin:12px 0}.hidden{display:none!important}
dialog{width:min(900px,95vw);max-height:90vh;background:#101b2e;border:1px solid #40617f;color:var(--ink);border-radius:16px;padding:25px}dialog::backdrop{background:#000c}pre{background:#06101e;border:1px solid #24344e;border-radius:10px;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:auto;line-height:1.5}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}.actions{grid-column:1/-1}}@media(max-width:460px){.row{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:26px}}
</style></head><body>
<header><div><div class="brand">SYNC <span>ADMIN</span></div><div class="sub">REMOTE SCAN MANAGEMENT</div></div><div id="headRight" class="muted">PAINEL WEB</div></header>
<main>
<section id="login" class="login"><h1>Entrar no painel</h1><p>Use o token <b>SYNC_ADMIN_TOKEN</b> configurado no Netlify. Ele não é salvo no navegador.</p><form id="loginForm"><input id="token" type="password" placeholder="Token de administrador" autocomplete="off" required minlength="12"><button class="primary" type="submit">CONECTAR</button></form><div id="loginError" class="muted" style="margin-top:15px"></div></section>
<section id="dashboard" class="hidden">
<div class="top"><div><h1 style="margin:0">Visão geral</h1><p class="muted">Atualização automática a cada 8 segundos</p></div><div class="actions"><button id="refresh">ATUALIZAR</button><button id="logout">SAIR</button></div></div>
<div id="notice" role="status"></div>
<div class="stats"><div class="stat"><label>TOTAL</label><strong id="total">0</strong></div><div class="stat"><label>PENDENTES</label><strong id="pending">0</strong></div><div class="stat"><label>LIBERADOS</label><strong id="unlocked">0</strong></div><div class="stat"><label>ONLINE (60 S)</label><strong id="online">0</strong></div></div>
<div class="panel"><div class="top"><h2>Dispositivos</h2><span class="muted" id="updated">—</span></div><div id="devices" aria-live="polite">Carregando...</div></div>
</section>
</main>
<dialog id="reportDialog"><div class="top"><div><h2 style="margin:0">VIEW FULL SCAN</h2><span id="reportDevice" class="muted"></span></div><div class="actions"><button id="copyReport">COPIAR</button><button id="closeDialog">FECHAR</button></div></div><div id="reportDate" class="muted"></div><pre id="reportText"></pre></dialog>
<script>
(()=>{'use strict';
let adminToken='',devices=[],busy=false,reportText='';
const $=id=>document.getElementById(id);
const fmt=ms=>ms?new Date(ms).toLocaleString('pt-BR'):'—';
const short=id=>id.slice(0,14)+'…'+id.slice(-8);
const showError=msg=>{$('notice').textContent=msg;};
async function api(route,body={}){
 const r=await fetch('/api/'+route,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','Authorization':'Bearer '+adminToken},body:JSON.stringify(body)});
 let data;try{data=await r.json()}catch{throw Error('Resposta inválida do servidor ('+r.status+')')}
 if(!r.ok)throw Error(data.error||'Erro HTTP '+r.status);return data;
}
function render(){
 const now=Date.now();
 $('total').textContent=devices.length;
 $('pending').textContent=devices.filter(d=>d.status==='pending').length;
 $('unlocked').textContent=devices.filter(d=>d.status==='unlocked').length;
 $('online').textContent=devices.filter(d=>now-d.lastSeen<60000).length;
 $('updated').textContent='Atualizado: '+new Date().toLocaleTimeString('pt-BR');
 const list=$('devices');list.replaceChildren();
 if(!devices.length){list.textContent='Nenhum PC registrado. O scanner precisa executar a conexão /hello.';return;}
 for(const d of devices){
  const row=document.createElement('div');row.className='row';
  const ident=document.createElement('div');const title=document.createElement('div');title.className='id';title.title=d.device;title.textContent=short(d.device);
  const last=document.createElement('div');last.className='muted';last.textContent='Último contato: '+fmt(d.lastSeen);ident.append(title,last);
  const status=document.createElement('div');const pill=document.createElement('span');pill.className='pill '+d.status;pill.textContent=d.status==='unlocked'?'LIBERADO':d.status==='locked'?'BLOQUEADO':'PENDENTE';status.append(pill);
  const report=document.createElement('div');const mark=document.createElement('div');mark.textContent=d.hasReport?'SCAN COMPLETO':'SEM RELATÓRIO';mark.style.color=d.hasReport?'#36dba4':'#92a6c5';report.append(mark);
  const acts=document.createElement('div');acts.className='actions';
  const view=document.createElement('button');view.textContent='VIEW FULL SCAN';view.disabled=!d.hasReport;view.onclick=()=>viewReport(d);acts.append(view);
  const allow=document.createElement('button');allow.textContent='LIBERAR';allow.className='green';allow.disabled=d.status==='unlocked';allow.onclick=()=>decision(d,'unlocked');acts.append(allow);
  const block=document.createElement('button');block.textContent='BLOQUEAR';block.className='danger';block.disabled=d.status==='locked';block.onclick=()=>decision(d,'locked');acts.append(block);
  row.append(ident,status,report,acts);list.append(row);
 }
}
async function refresh(){if(!adminToken||busy)return;busy=true;try{devices=(await api('list')).devices||[];showError('');render()}catch(e){showError('Falha ao atualizar: '+e.message)}finally{busy=false}}
async function decision(d,status){try{await api('decision',{device:d.device,status});await refresh()}catch(e){showError(e.message)}}
async function viewReport(d){try{const data=await api('view',{device:d.device});reportText=data.report||'';$('reportDevice').textContent=d.device;$('reportDate').textContent='Recebido: '+fmt(data.reportAt);$('reportText').textContent=reportText||'Relatório vazio.';$('reportDialog').showModal()}catch(e){showError(e.message)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();adminToken=$('token').value.trim();$('loginError').textContent='Conectando...';try{devices=(await api('list')).devices||[];$('token').value='';$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('headRight').textContent='CONECTADO • NETLIFY';render();$('loginError').textContent=''}catch(err){adminToken='';$('loginError').textContent='Erro: '+err.message}};
$('refresh').onclick=refresh;$('logout').onclick=()=>{adminToken='';devices=[];$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');$('headRight').textContent='PAINEL WEB';$('token').focus()};
$('closeDialog').onclick=()=>$('reportDialog').close();$('copyReport').onclick=()=>navigator.clipboard.writeText(reportText).catch(()=>{});
setInterval(()=>{if(!document.hidden)refresh()},8000);
})();
</script></body></html>
